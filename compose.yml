# Galician voice pipelines for Home Assistant (wyoming protocol).
#   stt  = whisper.cpp (large-v3-turbo, Vulkan on AMD 780M) -> wyoming :10300
#   tts  = phoonnx + wyoming-ovos-tts bridge                 -> wyoming :10400 (debug HTTP :9666)
#          (voices incl. piper-voices ports like piper/es_ES-davefx-medium if added)
#
# Data dirs are RELATIVE to this compose file (./phoonnx-data etc.), so run
# compose FROM THIS FOLDER:  cd wyoming-voice-gl && docker compose up -d --build
# From another cwd, pass the compose file explicitly; relative paths resolve
# against its directory:
#   docker compose -f /path/to/wyoming-voice-gl/compose.yml up -d --build
name: wyoming-voice-gl

services:
  whisper:
    build:
      context: ./stt/whisper-vulkan
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
    image: wyoming-whisper-vulkan
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    ports:
      - "10300:10300"
    environment:
      - TZ=${TZ:-Europe/Madrid}
    command: ["-l", "${WHISPER_LANG:-gl}"]

  phoonnx:
    build: ./tts/phoonnx-wyoming
    image: phoonnx-wyoming:latest
    restart: unless-stopped
    # Keep the tracked config in the repo and mount it read-only; the runtime
    # cache stays in phoonnx-data.
    volumes:
      - ./phoonnx-data:/home/ovos/.cache
      - ./tts/phoonnx-wyoming/mycroft.conf:/home/ovos/.config/mycroft/mycroft.conf:ro
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - PHOONNX_DEFAULT_VOICE_GL=proxectonos/celtia
    entrypoint: ["wyoming-ovos-tts"]
    command: ["--uri", "tcp://0.0.0.0:10400", "--plugin-name", "ovos-tts-plugin-phoonnx"]
    ports:
      - "10400:10400"
      - "9666:9666"

