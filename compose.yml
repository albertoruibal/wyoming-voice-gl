# Galician voice pipelines for Home Assistant (wyoming protocol).
#   stt  = whisper.cpp (large-v3-turbo, Vulkan on AMD 780M) -> wyoming :10300
#   tts  = phoonnx + wyoming-ovos-tts bridge                 -> wyoming :10400 (debug HTTP :9666 localhost)
#          (voices incl. piper-voices ports like piper/es_ES-davefx-medium if added)
#
# Data dirs are RELATIVE to this compose file (./phoonnx-data, ./whisper-data),
# so run compose FROM THIS FOLDER:  cd wyoming-voice-gl && ./setup.sh
# From another cwd, pass the compose file explicitly; relative paths resolve
# against its directory:
#   docker compose -f /path/to/wyoming-voice-gl/compose.yml up -d
name: wyoming-voice-gl

services:
  whisper:
    build:
      context: ./stt/whisper-vulkan
    image: wyoming-whisper-vulkan
    restart: unless-stopped
    init: true
    # The model is fetched by setup.sh, not baked into the image, so changing
    # WHISPER_MODEL needs only a restart.
    volumes:
      - ./whisper-data:/models
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      # Host render node /dev/dri/renderD128 is owned by the host's dynamic
      # "render" group (gid 992 on this Ubuntu host, NOT the image's gid 105).
      # Without it RADV cannot open the render node and whisper.cpp silently
      # falls back to CPU (logs: whisper_backend_init_gpu: no GPU found).
      - "992"
    # Vulkan/Mesa needs the wider syscall set on this host. Drop this if the
    # default seccomp profile works for your GPU/driver.
    security_opt:
      - seccomp:unconfined
    ports:
      - "10300:10300"
    environment:
      - TZ=${TZ:-Europe/Madrid}
    command: ["-l", "${WHISPER_LANG:-gl}", "-m", "${WHISPER_MODEL:-large-v3-turbo}"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10300'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  phoonnx:
    build: ./tts/phoonnx-wyoming
    image: phoonnx-wyoming:latest
    restart: unless-stopped
    init: true
    # Live bind mounts: config edits need only `docker compose restart phoonnx`
    # (no rebuild); the runtime cache stays in phoonnx-data.
    volumes:
      - ./phoonnx-data:/home/ovos/.cache
      - ./tts/phoonnx-wyoming/mycroft.conf:/home/ovos/.config/mycroft/mycroft.conf:ro
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - PHOONNX_DEFAULT_VOICE_GL=proxectonos/celtia
    entrypoint: ["wyoming-ovos-tts"]
    command: ["--uri", "tcp://0.0.0.0:10400", "--plugin-name", "ovos-tts-plugin-phoonnx"]
    ports:
      - "10400:10400"
      - "127.0.0.1:9666:9666"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10400'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
