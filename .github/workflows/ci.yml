name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Python syntax and help
        run: |
          python -m py_compile tests/probe_stt.py tests/probe_tts.py
          python tests/probe_stt.py --help
          python tests/probe_tts.py --help

      - name: Validate compose file
        run: docker compose config -q

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck setup.sh
          shellcheck tests/run_roundtrip.sh
          shellcheck stt/whisper-vulkan/run.sh

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          config: .hadolint.yaml
